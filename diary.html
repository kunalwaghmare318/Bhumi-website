.cv .back .pgwrap{position:absolute;inset:1.8% .3% 3% 4.7%;background:var(--paper);border-radius:16px 3px 3px 16px;background-image:linear-gradient(270deg,rgba(109,31,58,.14),transparent 14%)}
.cv .front{background:none;border-radius:0;padding:0}
.cv img.c{position:absolute;inset:0;width:100%;height:100%}
.patch{position:absolute;inset:0;clip-path:inset(43.2% 0 42.5% 71.5%)}
.patch img{transform:translateY(14.23%)}
.strap{position:absolute;inset:0;width:100%;height:100%;clip-path:inset(44.2% 0 42.8% 72.4%);transform-origin:100% 50%;filter:drop-shadow(0 .3em .4em rgba(60,10,30,.35))}
.pgc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pol{width:78%;background:#fff;padding:.9em .9em 0;box-shadow:0 .2em .9em rgba(109,31,58,.25);transform:rotate(var(--r));position:relative;text-align:center}
.pol:before{content:"";position:absolute;left:50%;top:-.9em;width:5em;height:1.6em;margin-left:-2.5em;background:rgba(232,169,188,.75);transform:rotate(-3deg)}
.ph{aspect-ratio:1;background:linear-gradient(135deg,#F8D7E0,#E8A9BC);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:1.5em;overflow:hidden;outline:.12em dashed rgba(109,31,58,.35);outline-offset:-.5em}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pol p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.9em;margin:0;padding:.55em 0 .6em}
#strapHint,#hint2{position:absolute;left:0;right:0;text-align:center;font-size:14px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;pointer-events:none;transition:opacity .4s}
#strapHint{bottom:calc(5vh + env(safe-area-inset-bottom,0px));animation:bob 1.8s ease-in-out infinite}
#hint2{bottom:calc(3vh + env(safe-area-inset-bottom,0px));opacity:0}
@keyframes bob{50%{transform:translateY(6px)}}
#book.closed .back,#book.closed .baseL{visibility:hidden}
#book .cv .back{background:#e8a3ab}
#book .cv .back .pgwrap{opacity:0;transition:opacity .6s}
#book:not(.full) .baseL{visibility:hidden}
.arr{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:0;background:var(--btn);color:var(--btnink);font-size:26px;line-height:1;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s,transform .2s;z-index:2000;box-shadow:0 4px 14px rgba(60,10,30,.3)}
.arr.on{opacity:1;pointer-events:auto}.arr:active{transform:scale(.92)}.arr.on:disabled{opacity:.25}
#prev{left:max(6px,env(safe-area-inset-left,0px))}#next{right:max(6px,env(safe-area-inset-right,0px))}
