<style>
:root{--bg1:#F8D7E0;--bg2:#E8A9BC;--ink:#6D1F3A;--line:#D97FA0;--paper:#fffafb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#4a1530;--bg2:#2a0b1b;--ink:#F8D7E0;--line:#D97FA0;--paper:#fff3f6}}
:root[data-theme="dark"]{--bg1:#4a1530;--bg2:#2a0b1b;--ink:#F8D7E0;--line:#D97FA0;--paper:#fff3f6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Quicksand,system-ui,sans-serif;overflow-x:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed}
#wrap{position:relative;overflow:hidden;isolation:isolate}
.hero{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(2.6rem,12vw,5.5rem);line-height:1.05;margin:0}
h1 em{display:block;font-style:italic}
.stop{display:inline-block;width:.14em;height:.14em;border-radius:50%;background:var(--ink);margin-left:.05em;visibility:hidden}
.hint{position:absolute;bottom:calc(5vh + env(safe-area-inset-bottom,0px));font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.75;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
svg{position:absolute;left:0;top:0;z-index:0;pointer-events:none}
#trail{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#dot{fill:var(--ink);filter:drop-shadow(0 0 6px rgba(217,127,160,.9))}
.card{position:absolute;z-index:5;background:#fff;padding:.7rem .7rem 0;box-shadow:0 6px 22px rgba(109,31,58,.28);text-align:center;transform-origin:50% 0;opacity:0;transform:translateY(24px) scale(.6) rotate(0deg);transition:opacity .5s,transform .8s cubic-bezier(.2,1.5,.4,1)}
.card.show{opacity:1;transform:rotate(var(--r))}
.card:before{content:"";position:absolute;left:50%;top:-.7rem;width:4.2rem;height:1.3rem;margin-left:-2.1rem;background:rgba(232,169,188,.8);transform:rotate(-3deg)}
.ph{aspect-ratio:1;background:linear-gradient(135deg,#F8D7E0,#E8A9BC);display:flex;align-items:center;justify-content:center;color:#6D1F3A;font-size:1.1rem;cursor:pointer;overflow:hidden;outline:2px dashed rgba(109,31,58,.35);outline-offset:-8px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.card p:empty{display:none}.card:has(p:empty){padding-bottom:.7rem}.card p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.25rem;margin:0;padding:.5rem 0 .6rem;color:#6D1F3A}
.st{position:absolute;z-index:5;transform-origin:50% 100%;filter:drop-shadow(0 6px 10px rgba(109,31,58,.3));pointer-events:none}
.st.hit{animation:hop .65s}
@keyframes hop{30%{transform:translateY(-16px) scale(1.04,.97)}60%{transform:translateY(0) scale(.97,1.04)}}
.end{position:absolute;left:0;right:0;text-align:center;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(1.5rem,6vw,2.4rem);z-index:2}
</style></head><body>

let S=[],total=0,stops=[],cards=[],sts=[],H=0;
const sm=t=>t*t*(3-2*t);
function build(){
 wrap.querySelectorAll('.card,.st').forEach(c=>c.remove());cards=[];sts=[];S=[];stops=[];
 const W0=innerWidth,vh=innerHeight,wide=W0>800,W=wide?Math.min(W0,1000):W0,ox=(W0-W)/2,bw=W*.4,bh=wide?Math.min(vh*.5,360):Math.min(vh*.32,300),cw=wide?Math.min(W*.34,290):Math.min(W*.46,230);
 const dim=STICKERS.map(s=>{const k=Math.min(bw/s.w,bh/s.h);return[s.w*k,s.h*k]});
 const maxH=Math.max(...dim.map(d=>d[1])),gap=wide?Math.max(maxH+110,cw+150):Math.max(maxH+270,vh*.75);
 const r=$('#stop').getBoundingClientRect(),sx=r.left+r.width/2,sy=r.top+scrollY+r.height/2;
 let l=0;const add=(x,y)=>{if(S.length){const p=S[S.length-1];l+=Math.hypot(x-p.x,y-p.y)}S.push({x,y,l})};
 add(sx,sy);let cx=sx,cy=sy;
 const seg=(x1,y1)=>{const N=70,amp=Math.min(24,(y1-cy)/18);for(let k=1;k<=N;k++){const t=k/N;add(cx+(x1-cx)*sm(t),cy+(y1-cy)*t+amp*Math.sin(t*Math.PI*4)*Math.sin(t*Math.PI)*(Math.abs(x1-cx)>5?1:0))}cx=x1;cy=y1};
 PHOTOS.forEach((p,i)=>{
  const left=i%2===0,[sw,sh]=dim[i],y=sy+gap*(i+1),sl=ox+(left?W*.04:W*.96-sw),x=sl+sw*[.5,.66,.5,.5,.5][i];
  seg(x,y);stops.push(S[S.length-1].l);
  const st=document.createElement('img');st.className='st';st.src=STICKERS[i].src;st.alt='';
  st.style.cssText=`left:${sl}px;top:${y-2}px;width:${sw}px;height:${sh}px`;wrap.appendChild(st);sts.push(st);
  const cl=left?sl+sw+W*.02:sl-W*.02-cw;
  const c=document.createElement('div');c.className='card';c.style.cssText=`width:${cw}px;left:${cl}px;top:${y+40}px;--r:${left?3:-3}deg`;
  c.innerHTML=`<div class="ph" data-i="${i}">${p.src?`<img src="${p.src}" alt="">`:'＋ photo'}</div><p>${p.cap}</p>`;
  wrap.appendChild(c);cards.push(c);
  if(i<PHOTOS.length-1)seg(x,y+sh*.5+20);
 });
 S.forEach((p,i)=>p.m=i?Math.max(S[i-1].m,p.y):p.y);const last=S[S.length-1];total=last.l;
 const endY=last.y+Math.max(maxH,cw+110)+60;H=endY+170;wrap.style.height=H+'px';
 svg.setAttribute('width',W0);svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${W0} ${H}`);

 render();
}
function render(){
 if(!S.length)return;
 const ty=scrollY+innerHeight*.4;let lo=0,hi=S.length-1;
 while(lo<hi){const m=(lo+hi)>>1;S[m].m<ty?lo=m+1:hi=m}
 const i=Math.max(1,lo),a=S[i-1],b=S[i],f=b.y===a.y?0:Math.min(1,Math.max(0,(ty-a.y)/(b.y-a.y)));
 const x=a.x+(b.x-a.x)*f,y=a.y+(b.y-a.y)*f,l=ty<=S[0].y?0:a.l+(b.l-a.l)*f;
 dot.setAttribute('cx',ty<=S[0].y?S[0].x:x);dot.setAttribute('cy',ty<=S[0].y?S[0].y:y);
 trail.setAttribute('stroke-dasharray',`${l} ${total+10}`);
 cards.forEach((c,k)=>{const on=l>=stops[k]-30;c.classList.toggle('show',on);sts[k].classList.toggle('hit',on)});
}
addEventListener('scroll',render,{passive:true});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,150)});
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{$('#stop').style.visibility='hidden';build()});
let pick=null;wrap.addEventListener('click',e=>{const h=e.target.closest('.ph');if(h){pick=+h.dataset.i;$('#file').click()}});
$('#file').onchange=e=>{const fl=e.target.files[0];if(!fl||pick===null)return;const u=URL.createObjectURL(fl);PHOTOS[pick].src=u;cards[pick].querySelector('.ph').innerHTML=`<img src="${u}" alt="">`;e.target.value=''};
